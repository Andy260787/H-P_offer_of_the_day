<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عرض اليوم | Handsome &amp; Pretty</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f7f1fc;--bg2:#ece1f7;--glow1:rgba(193,138,232,.55);--glow2:rgba(201,164,92,.30);--ink:#26232d;--muted:#6f6b78;--accent:#9b5fc9;--deep:#5b3a80;--gold:#c9a45c;--glass:rgba(255,255,255,.66);--tile:#fff;--line:rgba(91,58,128,.15);--shadow:0 20px 50px rgba(91,58,128,.18);--red:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#120f17;--bg2:#1c1524;--glow1:rgba(155,95,201,.38);--glow2:rgba(201,164,92,.16);--ink:#f3eff8;--muted:#aaa4b7;--accent:#c18ae8;--deep:#e2c9f4;--glass:rgba(40,31,52,.66);--tile:#2b2237;--line:rgba(255,255,255,.12);--shadow:0 20px 50px rgba(0,0,0,.5);--red:#ee6b5c}}
:root[data-theme="dark"]{--bg1:#120f17;--bg2:#1c1524;--glow1:rgba(155,95,201,.38);--glow2:rgba(201,164,92,.16);--ink:#f3eff8;--muted:#aaa4b7;--accent:#c18ae8;--deep:#e2c9f4;--glass:rgba(40,31,52,.66);--tile:#2b2237;--line:rgba(255,255,255,.12);--shadow:0 20px 50px rgba(0,0,0,.5);--red:#ee6b5c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:80vmax;height:80vmax}
body::before{left:-35vmax;top:-40vmax;background:radial-gradient(closest-side,var(--glow1),transparent)}
body::after{right:-40vmax;bottom:-40vmax;background:radial-gradient(closest-side,var(--glow2),transparent)}
main{width:100%;max-width:480px;padding:22px 16px 44px;text-align:center}
.brand{display:inline-block;background:#fff;border-radius:24px;padding:12px 26px;box-shadow:0 10px 30px rgba(91,58,128,.2),inset 0 0 0 1px rgba(91,58,128,.08)}
.brand img{display:block;width:min(46vw,170px);height:auto}
.kicker{display:inline-block;margin-top:24px;padding:5px 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:13px;font-weight:700;color:var(--deep)}
h1{font-size:clamp(28px,8vw,38px);font-weight:900;margin:10px 0 6px;background:linear-gradient(90deg,var(--deep),var(--accent) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);margin:0 auto 22px;max-width:32ch;line-height:1.8}
.deal{position:relative;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:32px;padding:28px 18px 22px;box-shadow:var(--shadow);overflow:hidden}
.deal::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.content{transition:filter .5s,opacity .5s}
.deal.ended .content{filter:grayscale(1);opacity:.5}
.disc{width:118px;aspect-ratio:1;margin:0 auto 14px;border-radius:50%;display:grid;place-content:center;background:linear-gradient(135deg,#f6e4b4,#c9a45c);color:#3a2a08;box-shadow:0 10px 26px rgba(201,164,92,.5);line-height:1}
.disc b{font-size:38px;font-weight:900;direction:ltr}
.disc span{font-size:15px;font-weight:700;margin-top:4px}
.deal h2{margin:0;font-size:26px;font-weight:900}
.deal p.ds{margin:8px auto 0;max-width:30ch;color:var(--muted);line-height:1.8}
.price{margin-top:10px;display:flex;justify-content:center;gap:12px;align-items:baseline}
.price[hidden]{display:none}
.price s{color:var(--muted);font-size:16px}
.price strong{font-size:26px;color:var(--deep);font-weight:900}
.st{margin:20px 0 10px;font-size:14px;font-weight:700;color:var(--deep)}
.timer{display:flex;justify-content:center;gap:10px;direction:ltr}
.t{min-width:70px;padding:10px 0 8px;border-radius:16px;background:var(--tile);border:1px solid var(--line);box-shadow:0 6px 14px rgba(91,58,128,.1)}
.t[hidden]{display:none}
.t b{display:block;font:900 30px/1.1 ui-monospace,Menlo,monospace;color:var(--deep)}
.t span{font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--line);margin:16px 6px 0;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width 1s linear}
.stamp{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:5px solid var(--red);color:var(--red);border-radius:14px;padding:6px 26px;font-size:clamp(32px,10vw,48px);font-weight:900;line-height:1.15;background:rgba(255,255,255,.35);animation:stamp .55s cubic-bezier(.2,2,.4,1)}
.stamp[hidden]{display:none}
.stamp small{display:block;font:700 15px/1.2 Cairo,sans-serif;letter-spacing:.35em;direction:ltr}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0}}
label{display:block;text-align:right;font-size:14px;color:var(--muted);margin:20px 4px 6px}
input{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--glass);color:var(--ink);font:500 16px Cairo,sans-serif}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#25d366,#128c4a);color:#fff;font-weight:900;font-size:18px;text-decoration:none;box-shadow:0 10px 24px rgba(18,140,74,.4);transition:transform .2s}
.wa:hover{transform:translateY(-2px)}
.wa[aria-disabled="true"]{background:#8d8a94;box-shadow:none;cursor:not-allowed;transform:none;pointer-events:none}
#note{margin:14px 0 0;font-size:14px;color:var(--muted);line-height:1.8}
#note b{direction:ltr;unicode-bidi:isolate;color:var(--gold);font-family:ui-monospace,Menlo,monospace}
a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.stamp{animation:none}.bar i{transition:none}}
</style>
</head>

  setTimer(r.s==="ended"?0:target-t);
  $("fill").style.width=(live?Math.min(100,(t-ts(d.start))/(ts(d.end)-ts(d.start))*100):r.s==="ended"?100:0)+"%";
  $("wa").textContent=live?"💬 اشترك في العرض عبر واتساب":r.s==="soon"?"العرض لم يبدأ بعد":"انتهى العرض";
  $("wa").setAttribute("aria-disabled",live?"false":"true");
  if(live){link(d);$("note").textContent="سيؤكد لك فريقنا الحجز على واتساب."}
  else{
    wa.removeAttribute("href");
    const next=DEALS.filter(x=>ts(x.start)>t).sort((a,b)=>ts(a.start)-ts(b.start))[0];
    $("note").innerHTML=next&&r.s==="ended"?"عرض اليوم التالي يبدأ بعد <b>"+(p=>pad(p.d*24+p.h)+":"+pad(p.m)+":"+pad(p.s))(parts(ts(next.start)-t))+"</b>":"ترقب عرضنا القادم 💜";
  }
}
nm.addEventListener("input",()=>{const r=status();if(r&&r.s==="live")link(r.d)});
wa.addEventListener("click",e=>{const r=status();if(!r||r.s!=="live"){e.preventDefault();render()}else link(r.d)});
render();setInterval(render,1000);
</script>
</body>
</html>
